[project]
name = "open-resume-studio-backend"
version = "0.1.0"
description = "Local-first, open-source AI resume workspace — backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "pymupdf>=1.27.2.2",
    "python-docx>=1.2.0",
    "httpx>=0.28.0",
    "google-genai>=0.8.0",
    "openai>=1.54.0",
    "anthropic>=0.40.0",
    "ollama>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "coverage>=7.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
